
name: Git Commit Email Notifications

on:
  push:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit notification
        uses: actions/github-script@v7
        id: prepare
        with:
          script: |
            const commits = context.payload.commits || [];
            const repo = context.repo;
            const branch = context.ref.replace('refs/heads/', '');

            const esc = (s = '') =>
              String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              })[c]);

            let html = `
              <div style="font-family:Arial,sans-serif;max-width:750px">
              <h2>[${esc(repo.owner)}/${esc(repo.repo)}] Push notification</h2>
              <p>
                <b>Branch:</b> ${esc(branch)}<br>
                <b>Home:</b>
                <a href="${context.serverUrl}/${repo.owner}/${repo.repo}">
                  ${esc(repo.owner)}/${esc(repo.repo)}
                </a>
              </p><hr>
            `;

            for (const c of commits) {
              html += `
                <h3>${esc(c.message)}</h3>
                <p>
                  <b>Commit:</b>
                  <a href="${esc(c.url)}">${esc(c.id)}</a><br>
                  <b>Author:</b> ${esc(c.author.name)}<br>
                  <b>Date:</b> ${esc(c.timestamp)}
                </p>
                <b>Changed paths:</b>
                <ul>
                  ${(c.added || []).map(f => `<li>A ${esc(f)}</li>`).join('')}
                  ${(c.modified || []).map(f => `<li>M ${esc(f)}</li>`).join('')}
                  ${(c.removed || []).map(f => `<li>D ${esc(f)}</li>`).join('')}
                </ul>
                <hr>
              `;
            }

            html += '</div>';

            core.setOutput('html', html);

            const text = [
              `Repository: ${repo.owner}/${repo.repo}`,
              `Branch: ${branch}`,
              ...commits.map(c => [
                `Commit: ${c.id}`,
                `Link: ${c.url}`,
                `Author: ${c.author.name}`,
                `Date: ${c.timestamp}`,
                `Log Message: ${c.message}`,
                'Changed paths:',
                ...(c.added || []).map(f => `A ${f}`),
                ...(c.modified || []).map(f => `M ${f}`),
                ...(c.removed || []).map(f => `D ${f}`)
              ].join('\n'))
            ].join('\n\n');

            core.setOutput('text', text);

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: GitHub Notifications <${{ secrets.MAIL_FROM }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[${{ github.repository }}] Push to ${{ github.ref_name }}"
          content_type: text/html
          html_body: ${{ steps.prepare.outputs.html }}
          body: ${{ steps.prepare.outputs.text }}
